<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/x-icon" href="../img/logo.png">
        <link rel="stylesheet" type="text/css" href="../styles/style.css">
        <meta name="description" content="The Elusive Mr. Doily CD surprise 1!">
        <meta name="robots" content="noindex, nofollow">
        <title>MR. DOILY IS A PSYOP</title>
        <style>
            html, body {
                overflow: hidden;
            }

            #psyop {
                position: absolute;
                white-space: nowrap;
                will-change: transform;
            }

        </style>
    </head>
    <body>
        <div class="goBackControl">
            <a href="../index.html" class="goBackLink">
                <picture>
                    <source type="image/webp" srcset="../img/buttons/back.webp">
                    <img src="../img/buttons/back.png" alt="Back Button" id="goBackButton">
                </picture>
            </a>
        </div>
        <p id="psyop">MR. DOILY IS A PSYOP. WAKE UP.</p>
        <p class="copyright">© 2026 Kieran Chau. All rights reserved.</p>
        <script src="../scripts/backbutton.js"></script>
        <script>
            const target = document.getElementById("psyop");
            const container = window;

            function moveRandomly() {
                const maxX = window.innerWidth - target.offsetWidth;
                const maxY = window.innerHeight;

                const randomX = Math.floor(Math.random() * maxX);
                const randomY = Math.floor(Math.random() * maxY);

                const minSize = 0.5;
                const maxSize = 7;
                const randomSize = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;

                target.style.fontSize = `${randomSize}vw`;
                target.style.left = `${randomX}px`;
                target.style.top = `${randomY}px`;

                setTimeout(moveRandomly, 75);
            }

            // Start the timer
            moveRandomly();
        </script>
    </body>
</html>
